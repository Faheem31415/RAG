[project]
name = "rag"
version = "0.1.0"
description = "Brew Haven Café RAG Application"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26.0",
    "requests>=2.31.0",
]

[project.scripts]
rag = "rag:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
